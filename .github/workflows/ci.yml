name: CI

# Checks every push and PR; a push to master that passes all checks and changed
# the integration is published as the next patch release. HACS installs this
# integration from release zips (hacs.json: zip_release), so a release is what
# makes a change show up as an update in HACS.

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-line-length=120 --statistics
      - name: Check black style
        run: black . --check
      - name: Run tests
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  release:
    needs: [checks, hassfest]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide next version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            # First release: start from the version already in manifest.json
            next="v$(jq -r .version custom_components/philips_airpurifier_http/manifest.json)"
          elif [ -z "$(git diff --name-only "$last" HEAD -- custom_components/)" ]; then
            echo "No integration changes since $last, skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v${major}.${minor}.$(( patch + 1 ))"
          fi
          echo "Releasing $next (previous: ${last:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        run: |
          tag=${{ steps.version.outputs.tag }}
          cd custom_components/philips_airpurifier_http
          jq --arg v "${tag#v}" '.version = $v' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          zip -r "$GITHUB_WORKSPACE/philips_airpurifier_http.zip" ./

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" philips_airpurifier_http.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
